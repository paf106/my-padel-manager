name: Deploy to Vercel

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy production
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $GITHUB_REF_NAME is not on master" >&2
            exit 1
          fi

      - name: Verify package.json matches the tag
        run: |
          VERSION="$(jq -r .version package.json)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "package.json ($VERSION) does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun add --global vercel

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_TEAM_ID" --token "$VERCEL_TOKEN"

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt application
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
